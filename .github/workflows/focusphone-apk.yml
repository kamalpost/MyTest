name: Build FocusPhone APK

on:
  workflow_dispatch:
  push:
    branches: [claude/feature-phone-focus-app-qn3wd0, main]
    paths: ['focusphone/**', '.github/workflows/focusphone-apk.yml']

permissions:
  contents: write

env:
  APP_VERSION: 1.0.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run unit tests and build release APK
        run: |
          cd focusphone
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - name: Rename APK
        run: cp focusphone/app/build/outputs/apk/release/app-release.apk FocusPhone-v${APP_VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusPhone-apk
          path: FocusPhone-v${{ env.APP_VERSION }}.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="focusphone-v${APP_VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" FocusPhone-v${APP_VERSION}.apk \
            --title "FocusPhone v${APP_VERSION} APK (build ${{ github.run_number }})" \
            --notes "Sideloadable Android APK built from ${{ github.sha }}. Download FocusPhone-v${APP_VERSION}.apk on your phone, open it, and allow installing from unknown sources when prompted." \
            --target "${{ github.sha }}"
