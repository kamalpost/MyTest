name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskmanager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK to a GitHub Release so it can be downloaded
      # directly on a phone without logging in or unzipping.
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TaskManager-debug.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" TaskManager-debug.apk \
            --title "Task Manager debug build #${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }} (branch ${{ github.ref_name }})" \
            --prerelease \
          || gh release upload "$TAG" TaskManager-debug.apk --clobber
