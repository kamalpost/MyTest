name: Build APK

on:
  push:
    branches: ['claude/road-rash-game-3za8r1', 'main']
    paths-ignore:
      - 'apk/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RoadBash-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK back to the branch
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/RoadBash.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/RoadBash.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "ci: publish built APK [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
