<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Road Bash — a Road Rash tribute</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; height: 100%;
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block; background: #000;
    image-rendering: auto;
  }
  .btn {
    position: fixed; z-index: 10;
    border-radius: 18px;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(20,20,40,0.35);
    color: rgba(255,255,255,0.85);
    font: bold 20px 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .btn.pressed { background: rgba(255,180,40,0.45); border-color: #ffb428; }
  #btnL     { left: 12px;  bottom: 16px; width: 88px; height: 96px; font-size: 40px; }
  #btnR     { left: 112px; bottom: 16px; width: 88px; height: 96px; font-size: 40px; }
  #btnBrake { right: 12px;  bottom: 16px; width: 92px; height: 44px; font-size: 16px; }
  #btnPunch { right: 116px; bottom: 16px; width: 84px; height: 96px; }
  #btnKick  { right: 12px;  bottom: 72px; width: 92px;  height: 40px; font-size: 16px; }
  #btnNitro { right: 116px; bottom: 124px; width: 84px; height: 44px; font-size: 15px;
              border-color: rgba(80,180,255,0.55); color: #9fd4ff; }
  #btnNitro.pressed { background: rgba(60,160,255,0.5); border-color: #4fa8ff; }
  .touchonly { display: none; }
  body.touch .touchonly { display: flex; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<div id="btnL"     class="btn touchonly">&#9664;</div>
<div id="btnR"     class="btn touchonly">&#9654;</div>
<div id="btnPunch" class="btn touchonly">PUNCH</div>
<div id="btnKick"  class="btn touchonly">KICK</div>
<div id="btnBrake" class="btn touchonly">BRAKE</div>
<div id="btnNitro" class="btn touchonly">NITRO</div>
<script>
'use strict';
/* ============================================================
   ROAD BASH — a loving tribute to the 16-bit classic Road Rash.
   Pseudo-3D racer with fisticuffs, nitro, cops and weapons.
   Pure canvas, zero assets.
   ============================================================ */

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

/* ---------- responsive letterbox scaling ---------- */
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  cv.style.width  = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---------- tunables ---------- */
const SEG = 200;                 // segment length (world units)
const ROADW = 2100;              // road half-width (world units)
const DRAW = 130;                // draw distance in segments
const CAMH = 1050;               // camera height above road
const CAMD = 0.84;               // camera depth (fov)
const MAXSPD = 12000;            // world units / second
const NITRO_SPD = MAXSPD * 1.28;
const ACCEL = MAXSPD / 5.5;
const BRAKE = MAXSPD / 1.4;
const OFFROAD_MAX = MAXSPD * 0.32;
const CENTRIFUGAL = 0.29;
const MPH = 168 / MAXSPD;        // display speed conversion

/* ---------- helpers ---------- */
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const easeInOut = t => t * t * (3 - 2 * t);
function mod(a, n) { return ((a % n) + n) % n; }

/* ============================================================
   TRACKS
   ============================================================ */
const TRACKS = [
  {
    name: 'PACIFIC COAST', stars: 1, segs: 5600, traffic: 34, cops: 1, rivalBoost: 0,
    sky: ['#1e1440', '#7a2d5e', '#e8683a', '#f7b23c'], fog: [247, 178, 60],
    mountains: ['#4a2a52', '#372046'],
    zones: [
      { grass: ['#3f9e4f', '#379147'], flora: ['palm', 'palm', 'bush'] },
      { grass: ['#5aa943', '#4f9c3b'], flora: ['bush', 'pine', 'barn'] },
      { grass: ['#c9a961', '#bd9d57'], flora: ['cactus', 'bush'] },
      { grass: ['#4a7d46', '#41733e'], flora: ['pine', 'pine', 'bush'] },
    ],
    layout: [
      [60, 80, 60, 0, 0], [50, 50, 50, 2.2, 10], [40, 40, 40, -2.6, -6],
      [60, 90, 60, 0, 24], [40, 60, 40, 4.2, -10], [30, 30, 30, -3.5, 0],
      [80, 120, 80, 0, -20], [50, 70, 50, 2.8, 14], [35, 35, 35, -4.6, 0],
      [60, 60, 60, 1.6, 8], [70, 100, 70, 0, 0], [45, 55, 45, -2.4, 18],
      [45, 55, 45, 3.6, -18], [30, 25, 30, -4.8, 4], [30, 25, 30, 4.8, -4],
      [80, 110, 80, 0, 28], [40, 50, 40, -3.2, -16], [50, 60, 50, 2.2, -14],
      [90, 130, 90, 0, -12], [45, 50, 45, -2.8, 0], [45, 50, 45, 2.8, 10],
      [35, 30, 35, -4.4, -8], [70, 90, 70, 1.4, 0], [60, 80, 60, 0, 0],
    ],
  },
  {
    name: 'SIERRA CLIMB', stars: 2, segs: 6200, traffic: 28, cops: 2, rivalBoost: 0.03,
    sky: ['#0e2036', '#2b6f9e', '#a8cfe0', '#dbe9ef'], fog: [219, 233, 239],
    mountains: ['#3f5d73', '#2c4457'],
    zones: [
      { grass: ['#3c7a3f', '#346f38'], flora: ['pine', 'pine', 'bush'] },
      { grass: ['#6f7d6a', '#657463'], flora: ['pine', 'bush'] },
      { grass: ['#4c8a4f', '#428046'], flora: ['pine', 'barn', 'bush'] },
      { grass: ['#7d8a80', '#718075'], flora: ['pine', 'bush'] },
    ],
    layout: [
      [50, 60, 50, 0, 6], [40, 60, 40, 3.0, 26], [30, 40, 30, -3.8, 14],
      [60, 90, 60, 1.2, 38], [30, 30, 30, -5.0, -6], [30, 30, 30, 5.0, 6],
      [70, 100, 70, 0, 34], [40, 50, 40, -4.2, -20], [40, 50, 40, 4.2, -22],
      [60, 80, 60, -1.8, 28], [30, 25, 30, 5.4, -8], [30, 25, 30, -5.4, 8],
      [80, 110, 80, 0, -42], [45, 55, 45, 3.4, -18], [45, 55, 45, -3.0, 12],
      [60, 70, 60, 2.0, 30], [35, 40, 35, -4.8, -14], [70, 90, 70, 0, -36],
      [45, 50, 45, 3.8, 10], [45, 50, 45, -3.8, -12], [60, 80, 60, 1.4, -18],
      [50, 70, 50, 0, 0],
    ],
  },
  {
    name: "DEVIL'S CANYON", stars: 3, segs: 6800, traffic: 44, cops: 2, rivalBoost: 0.05,
    sky: ['#2a0f1e', '#8f2f1f', '#e0653a', '#f2a35c'], fog: [242, 163, 92],
    mountains: ['#5c2418', '#42190f'],
    zones: [
      { grass: ['#c9a961', '#bd9d57'], flora: ['cactus', 'cactus', 'bush'] },
      { grass: ['#b0714a', '#a56642'], flora: ['cactus', 'bush'] },
      { grass: ['#c2915a', '#b78650'], flora: ['cactus', 'bush'] },
      { grass: ['#9c5f3e', '#915637'], flora: ['cactus', 'bush'] },
    ],
    layout: [
      [40, 50, 40, 0, 0], [30, 35, 30, -4.6, 8], [30, 35, 30, 4.9, -8],
      [50, 70, 50, 2.6, 18], [25, 25, 25, -5.8, 0], [25, 25, 25, 5.8, 0],
      [60, 90, 60, 0, -24], [40, 50, 40, -3.6, 20], [30, 30, 30, 6.2, -12],
      [50, 60, 50, -2.2, 16], [25, 20, 25, 5.6, -6], [25, 20, 25, -5.6, 6],
      [70, 100, 70, 1.6, 26], [35, 40, 35, -5.2, -22], [45, 55, 45, 4.4, -10],
      [60, 80, 60, 0, 22], [30, 30, 30, -6.0, -8], [30, 30, 30, 6.0, -8],
      [50, 70, 50, -3.0, -20], [45, 55, 45, 3.2, 10], [40, 45, 40, -4.4, 0],
      [60, 90, 60, 0, 0],
    ],
  },
];
let curTrack = 0;
let TRACKLEN = 0, N = 0;

const segments = [];
let pickups = [];
let lastY = 0;

function addRoad(enter, hold, leave, curve, dy) {
  const startY = lastY, endY = startY + dy * SEG;
  const total = enter + hold + leave;
  for (let i = 0; i < enter; i++)
    addSeg(curve * easeInOut(i / enter), lerp(startY, endY, easeInOut(i / total)));
  for (let i = 0; i < hold; i++)
    addSeg(curve, lerp(startY, endY, easeInOut((enter + i) / total)));
  for (let i = 0; i < leave; i++)
    addSeg(curve * easeInOut(1 - i / leave), lerp(startY, endY, easeInOut((enter + hold + i) / total)));
  lastY = endY;
}
function addSeg(curve, y) {
  const n = segments.length;
  segments.push({
    index: n, curve: curve,
    p1: { world: { y: n === 0 ? 0 : segments[n - 1].p2.world.y, z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { y: y, z: (n + 1) * SEG }, camera: {}, screen: {} },
    sprites: [], clip: H
  });
}

function zoneOf(i) { return Math.floor(i / N * 4) % 4; }

function buildTrack(ti) {
  const def = TRACKS[ti];
  segments.length = 0; lastY = 0;
  for (const r of def.layout) addRoad(r[0], r[1], r[2], r[3], r[4]);
  while (segments.length < def.segs) addSeg(0, lastY);
  N = segments.length;
  TRACKLEN = N * SEG;
  decorate(def);
}

function decorate(def) {
  for (let i = 20; i < N - 20; i++) {
    const zone = def.zones[zoneOf(i)];
    if (i % 3 === 0 && Math.random() < 0.75) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const x = side * rnd(1.4, 4.5);
      const kind = zone.flora[Math.floor(Math.random() * zone.flora.length)];
      segments[i].sprites.push({ kind, x, seed: Math.random() });
    }
    if (i % 120 === 40) {
      segments[i].sprites.push({ kind: 'billboard', x: (i % 240 === 40) ? -1.7 : 1.7, seed: Math.random() });
    }
  }
  segments[8].sprites.push({ kind: 'banner', text: 'START', x: 0 });
  segments[N - 12].sprites.push({ kind: 'banner', text: 'FINISH', x: 0 });

  /* pickups: nitro cans, clubs, chains, wrenches on the tarmac */
  pickups = [];
  const KINDS = ['nitro', 'club', 'wrench', 'chain', 'nitro', 'club'];
  let z = 220 * SEG, k = 0;
  while (z < TRACKLEN - 80 * SEG) {
    pickups.push({ z: z, x: rnd(-0.65, 0.65), kind: KINDS[k % KINDS.length], taken: false });
    k++;
    z += rnd(210, 330) * SEG;
  }
}

/* ============================================================
   STATE
   ============================================================ */
const RIVALS = [
  { name: 'VIPER',   bike: '#d43a3a', suit: '#222831' },
  { name: 'AXEL',    bike: '#3a6fd4', suit: '#3d2b1f' },
  { name: 'NATASHA', bike: '#111111', suit: '#5c1f6e' },
  { name: 'BIFF',    bike: '#2e8b57', suit: '#1f2d5c' },
  { name: 'SLADE',   bike: '#e6a817', suit: '#333333' },
];
const PAYOUT = [400, 250, 150, 80, 60, 40];
const FINE = 40;

let state = 'title';       // title | select | count | race | finish
let selIdx = 0;
let countT = 0, raceT = 0, finishT = 0, msgQ = [];
let shake = 0;
let cash = parseInt(lsGet('roadbash_cash') || '100', 10);
let unlocked = parseInt(lsGet('roadbash_unlock') || '0', 10);
let payoutMsg = '';

const player = {
  x: 0, z: 0, speed: 0, stamina: 100,
  punchT: 0, kickT: 0, hitDone: false,
  nitro: 2, nitroT: 0,
  weapon: null,              // {kind:'club'|'chain', uses}
  state: 'ride', crashT: 0, busted: false,
  place: 6, finished: false, finTime: 0,
  bike: '#b8b8c8', suit: '#8b1a1a'
};

let npcs = [], cars = [], cops = [];

function resetRace() {
  const def = TRACKS[curTrack];
  player.x = 0; player.z = 0; player.speed = 0; player.stamina = 100;
  player.punchT = 0; player.kickT = 0; player.state = 'ride'; player.crashT = 0;
  player.nitro = 2; player.nitroT = 0; player.weapon = null; player.busted = false;
  player.finished = false; player.finTime = 0; player.place = 6;
  raceT = 0; msgQ = []; shake = 0; payoutMsg = '';

  npcs = RIVALS.map((r, i) => ({
    name: r.name, bike: r.bike, suit: r.suit,
    z: (i + 1) * SEG * 3.2, x: (i % 2 ? -0.35 : 0.35) + i * 0.09,
    speed: 0, skill: rnd(0.855, 0.94) + def.rivalBoost, stamina: 100,
    club: Math.random() < 0.4,
    state: 'ride', crashT: 0, atkT: 0, atkCd: rnd(1, 2), steerT: 0, targX: 0,
    punchT: 0, finished: false, finTime: 0, cop: false
  }));

  cars = [];
  for (let i = 0; i < def.traffic; i++) {
    const oncoming = i % 3 === 2;
    cars.push({
      z: rnd(30 * SEG, TRACKLEN - 40 * SEG),
      x: oncoming ? rnd(-0.72, -0.2) : rnd(0.2, 0.72),
      speed: oncoming ? -rnd(0.16, 0.24) * MAXSPD : rnd(0.22, 0.34) * MAXSPD,
      kind: Math.random() < 0.3 ? 'truck' : 'car',
      hue: Math.floor(rnd(0, 360)), oncoming
    });
  }

  cops = [];
  for (let i = 0; i < def.cops; i++) {
    cops.push({
      name: 'OFFICER', bike: '#0d0d12', suit: '#1a2a4a', cop: true,
      z: (i + 1) * TRACKLEN / (def.cops + 1), x: 0.4,
      speed: 0, stamina: 160, mode: 'patrol',
      state: 'ride', crashT: 0, atkT: 0, atkCd: rnd(1.4, 2.4), punchT: 0,
      targX: 0.4, steerT: 0, respawnT: 0
    });
  }
}

function say(t, ms) { msgQ.push({ t, life: ms || 1.6 }); if (msgQ.length > 3) msgQ.shift(); }

function saveCash() { lsSet('roadbash_cash', String(cash)); }

/* ============================================================
   INPUT
   ============================================================ */
const keys = {};
let touchMode = false;
const input = { left: false, right: false, brake: false, punch: false, kick: false, nitro: false };

window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if (state === 'select') {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')  { selIdx = (selIdx + TRACKS.length - 1) % TRACKS.length; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { selIdx = (selIdx + 1) % TRACKS.length; }
  }
  keys[e.key] = true;
  if (e.key === 'Enter' || e.key === ' ') action();
  if (e.key === 'a' || e.key === 'A' || e.key === 'f' || e.key === 'F') input.punch = true;
  if (e.key === 's' || e.key === 'S' || e.key === 'g' || e.key === 'G') input.kick = true;
  if (e.key === 'n' || e.key === 'N' || e.key === 'Shift') input.nitro = true;
  bootAudio();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function bindBtn(id, prop) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); el.classList.add('pressed'); input[prop] = true; bootAudio(); };
  const off = e => { e.preventDefault(); el.classList.remove('pressed'); if (prop !== 'punch' && prop !== 'kick' && prop !== 'nitro') input[prop] = false; };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindBtn('btnL', 'left'); bindBtn('btnR', 'right'); bindBtn('btnBrake', 'brake');
bindBtn('btnPunch', 'punch'); bindBtn('btnKick', 'kick'); bindBtn('btnNitro', 'nitro');

function canvasCoords(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) * W / r.width, y: (clientY - r.top) * H / r.height };
}
cv.addEventListener('touchstart', e => {
  bootAudio();
  const t = e.changedTouches[0];
  const p = canvasCoords(t.clientX, t.clientY);
  screenTap(p.x, p.y);
}, { passive: true });
cv.addEventListener('mousedown', e => {
  bootAudio();
  const p = canvasCoords(e.clientX, e.clientY);
  screenTap(p.x, p.y);
});
window.addEventListener('touchstart', () => {
  if (!touchMode) { touchMode = true; document.body.classList.add('touch'); }
  bootAudio();
}, { passive: true });

const CARD = { w: 250, h: 210, y: 150, gap: 30 };
function cardRect(i) {
  const totalW = TRACKS.length * CARD.w + (TRACKS.length - 1) * CARD.gap;
  const x0 = (W - totalW) / 2;
  return { x: x0 + i * (CARD.w + CARD.gap), y: CARD.y, w: CARD.w, h: CARD.h };
}

function screenTap(x, y) {
  if (state === 'title') { state = 'select'; return; }
  if (state === 'select') {
    for (let i = 0; i < TRACKS.length; i++) {
      const r = cardRect(i);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
        selIdx = i;
        if (i <= unlocked) startRace(i);
        else say('Finish ' + TRACKS[i - 1].name + ' in the top 3 first!', 2);
        return;
      }
    }
    return;
  }
  if (state === 'finish' && finishT > 1) { state = 'select'; }
}

function action() {
  if (state === 'title') { state = 'select'; }
  else if (state === 'select') {
    if (selIdx <= unlocked) startRace(selIdx);
    else say('Finish ' + TRACKS[selIdx - 1].name + ' in the top 3 first!', 2);
  }
  else if (state === 'finish' && finishT > 1) { state = 'select'; }
}

function startRace(i) {
  curTrack = i;
  buildTrack(i);
  resetRace();
  state = 'count'; countT = 3.6;
}

/* ============================================================
   AUDIO — tiny WebAudio synth (engine, siren, thuds, riff)
   ============================================================ */
let AC = null, engOsc = null, engOsc2 = null, engGain = null, engFilt = null;
let sirOsc = null, sirGain = null;
let musicOn = true, musicTimer = null, beat = 0;

function bootAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  engOsc = AC.createOscillator(); engOsc.type = 'sawtooth';
  engOsc2 = AC.createOscillator(); engOsc2.type = 'square';
  engFilt = AC.createBiquadFilter(); engFilt.type = 'lowpass'; engFilt.frequency.value = 400;
  engGain = AC.createGain(); engGain.gain.value = 0;
  engOsc.connect(engFilt); engOsc2.connect(engFilt);
  engFilt.connect(engGain); engGain.connect(AC.destination);
  engOsc.start(); engOsc2.start();
  sirOsc = AC.createOscillator(); sirOsc.type = 'triangle'; sirOsc.frequency.value = 650;
  sirGain = AC.createGain(); sirGain.gain.value = 0;
  sirOsc.connect(sirGain); sirGain.connect(AC.destination);
  sirOsc.start();
  musicTimer = setInterval(riff, 214);   // ~140bpm eighth notes
}
const RIFF = [41.2, 41.2, 49, 41.2, 55, 41.2, 49, 46.2];  // E1 pentatonic-ish
function riff() {
  if (!AC || !musicOn || state === 'title' || state === 'select') return;
  const f = RIFF[beat % RIFF.length]; beat++;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'square'; o.frequency.value = f * 2;
  g.gain.setValueAtTime(0.05, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.18);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + 0.2);
  if (beat % 2 === 0) {
    const n = noiseNode(0.03, 6000); if (n) n.gain.gain.value = 0.02;
  }
}
function noiseNode(dur, freq) {
  if (!AC) return null;
  const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = 0.25;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  return { src, gain: g };
}
function sndPunch() { const n = noiseNode(0.09, 700); if (n) n.gain.gain.value = 0.5; }
function sndPickup() {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(660, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(1320, AC.currentTime + 0.12);
  g.gain.setValueAtTime(0.2, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.18);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.2);
}
function sndNitro() { const n = noiseNode(0.4, 1800); if (n) { n.gain.gain.setValueAtTime(0.35, AC.currentTime); n.gain.gain.exponentialRampToValueAtTime(0.01, AC.currentTime + 0.4); } }
function sndCrash() {
  const n = noiseNode(0.5, 300); if (n) {
    n.gain.gain.setValueAtTime(0.7, AC.currentTime);
    n.gain.gain.exponentialRampToValueAtTime(0.01, AC.currentTime + 0.5);
  }
}
function engineTick() {
  if (!AC || !engOsc) return;
  const r = clamp(player.speed / NITRO_SPD, 0, 1);
  const on = state === 'race' || state === 'count';
  const f = 38 + r * 170 + Math.sin(performance.now() / 55) * 3;
  engOsc.frequency.setTargetAtTime(f, AC.currentTime, 0.05);
  engOsc2.frequency.setTargetAtTime(f * 1.5 + 2, AC.currentTime, 0.05);
  engFilt.frequency.setTargetAtTime(280 + 1000 * r, AC.currentTime, 0.1);
  engGain.gain.setTargetAtTime(on && player.state === 'ride' ? 0.05 + 0.06 * r : 0.0, AC.currentTime, 0.15);
  // siren: two-tone when a cop is chasing nearby
  let copNear = false;
  if (state === 'race') {
    for (const c of cops) {
      if (c.state === 'ride' && c.mode === 'chase' && Math.abs(c.z - player.z) < 18 * SEG) { copNear = true; break; }
    }
  }
  if (sirOsc) {
    sirOsc.frequency.setTargetAtTime(Math.floor(performance.now() / 400) % 2 ? 660 : 510, AC.currentTime, 0.05);
    sirGain.gain.setTargetAtTime(copNear ? 0.04 : 0, AC.currentTime, 0.2);
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function segAt(z) { return segments[Math.floor(mod(z, TRACKLEN) / SEG)]; }

function update(dt) {
  if (state === 'count') {
    countT -= dt;
    if (countT <= 0.6) { state = 'race'; say('GO!!', 1); }
    updateRacers(dt, false);
    return;
  }
  if (state !== 'race' && state !== 'finish') return;
  raceT += dt;
  if (state === 'finish') finishT += dt;
  updateRacers(dt, true);
}

/* weapon reach/damage for the player's current swing */
function swingSpec() {
  const w = player.weapon;
  if (player.kickT > 0) return { zr: 2.6 * SEG, xr: 0.5, dmg: 30, kind: 'kick' };
  if (w && w.kind === 'chain') return { zr: 3.6 * SEG, xr: 0.62, dmg: 28, kind: 'chain' };
  if (w && w.kind === 'club')  return { zr: 2.8 * SEG, xr: 0.52, dmg: 36, kind: 'club' };
  return { zr: 2.6 * SEG, xr: 0.5, dmg: 20, kind: 'fist' };
}

function updateRacers(dt, live) {
  const pseg = segAt(player.z);

  /* ----- player ----- */
  if (live && !player.finished) {
    if (player.state === 'ride') {
      const r = player.speed / MAXSPD;
      const steer = (input.left || keys.ArrowLeft ? -1 : 0) + (input.right || keys.ArrowRight ? 1 : 0);
      player.x += steer * dt * 1.9 * (0.35 + 0.65 * Math.min(r, 1));
      player.x -= pseg.curve * r * r * CENTRIFUGAL * dt * 2.2;
      player.x = clamp(player.x, -1.9, 1.9);

      // nitro
      if (input.nitro) {
        input.nitro = false;
        if (player.nitro > 0 && player.nitroT <= 0) {
          player.nitro--; player.nitroT = 2.2; sndNitro(); say('NITRO!', 0.8);
        }
      }
      const boosting = player.nitroT > 0;
      if (boosting) player.nitroT -= dt;

      // throttle: auto-accelerate, brake to slow
      const braking = input.brake || keys.ArrowDown;
      if (braking) player.speed -= BRAKE * dt;
      else player.speed += ACCEL * dt * (boosting ? 2.6 : (keys.ArrowUp ? 1.15 : 1));

      // off-road drag + obstacle check
      if (Math.abs(player.x) > 1.02) {
        if (player.speed > OFFROAD_MAX) player.speed -= MAXSPD * dt * 0.9;
        shake = Math.max(shake, 3);
        for (const s of pseg.sprites) {
          if (s.kind !== 'banner' && Math.abs(s.x - player.x) < 0.25 && player.speed > MAXSPD * 0.1) {
            crashPlayer('You hit a ' + s.kind + '!');
            break;
          }
        }
      }
      player.speed = clamp(player.speed, 0, boosting ? NITRO_SPD : Math.max(MAXSPD, player.speed - MAXSPD * dt * 0.5));
      player.z += player.speed * dt;

      // combat timers
      if (player.punchT > 0) player.punchT -= dt;
      if (player.kickT > 0) player.kickT -= dt;
      if (input.punch) { input.punch = false; if (player.punchT <= 0 && player.kickT <= 0) { player.punchT = 0.38; player.hitDone = false; } }
      if (input.kick)  { input.kick = false;  if (player.punchT <= 0 && player.kickT <= 0) { player.kickT = 0.5;  player.hitDone = false; } }
      const swinging = (player.punchT > 0.1 && player.punchT < 0.3) || (player.kickT > 0.15 && player.kickT < 0.38);
      if (swinging && !player.hitDone) {
        const spec = swingSpec();
        const foe = nearestFighter(player.z, player.x, spec.zr, spec.xr);
        if (foe) {
          player.hitDone = true;
          foe.stamina -= spec.dmg;
          foe.x += (foe.x >= player.x ? 0.22 : -0.22);
          foe.speed *= 0.94;
          sndPunch(); shake = Math.max(shake, 5);
          // weapons wear out (only on punches, not kicks)
          if (player.weapon && player.kickT <= 0) {
            player.weapon.uses--;
            if (player.weapon.uses <= 0) { say('Your ' + player.weapon.kind + ' broke!', 1.4); player.weapon = null; }
          }
          if (foe.stamina <= 0) {
            crashNpc(foe);
            if (foe.cop) { say('YOU DECKED THE COP!', 2); cash += 25; saveCash(); }
            else say(foe.name + ' WIPED OUT!');
          }
          else say('You hit ' + (foe.cop ? 'the cop' : foe.name) + '!', 0.9);
        }
      }

      // pickups
      for (const p of pickups) {
        if (p.taken) continue;
        const dz = p.z - player.z;
        if (dz > -SEG && dz < 1.2 * SEG && Math.abs(p.x - player.x) < 0.28) {
          p.taken = true; sndPickup();
          if (p.kind === 'nitro') { player.nitro = Math.min(3, player.nitro + 1); say('NITRO CAN +1', 1.2); }
          else if (p.kind === 'wrench') { player.stamina = clamp(player.stamina + 35, 0, 100); say('PATCHED UP +35', 1.2); }
          else if (p.kind === 'club') { player.weapon = { kind: 'club', uses: 6 }; say('GRABBED A CLUB!', 1.4); }
          else if (p.kind === 'chain') { player.weapon = { kind: 'chain', uses: 5 }; say('GRABBED A CHAIN!', 1.4); }
        }
      }

      // finish
      if (player.z >= TRACKLEN - 12 * SEG) {
        player.finished = true; player.finTime = raceT;
        state = 'finish'; finishT = 0; sndPunch();
        onFinish();
      }
    } else { // crashed
      player.crashT -= dt;
      player.speed = Math.max(0, player.speed - MAXSPD * dt * 1.6);
      player.z += player.speed * dt;
      if (player.crashT <= 0) {
        player.state = 'ride'; player.stamina = player.busted ? 80 : 65;
        player.busted = false; player.x = clamp(player.x, -0.9, 0.9);
      }
    }
  } else if (player.finished) {
    player.speed = Math.max(0, player.speed - MAXSPD * dt * 0.35);
    player.z += player.speed * dt;
  }

  /* ----- rivals ----- */
  for (const n of npcs) {
    if (!live) { n.speed = 0; continue; }
    if (n.finished) { n.speed = Math.max(0, n.speed - MAXSPD * dt * 0.4); n.z += n.speed * dt; continue; }
    if (n.state === 'crash') {
      n.crashT -= dt;
      n.speed = Math.max(0, n.speed - MAXSPD * dt * 1.7);
      n.z += n.speed * dt;
      if (n.crashT <= 0) { n.state = 'ride'; n.stamina = 80; n.x = clamp(n.x, -0.8, 0.8); }
      continue;
    }
    const gap = n.z - player.z;
    let target = MAXSPD * n.skill;
    if (gap > 90 * SEG) target *= 0.86;
    else if (gap < -60 * SEG) target = MAXSPD * 0.985;
    const nseg = segAt(n.z);
    target *= 1 - Math.min(0.28, Math.abs(nseg.curve) * 0.05);
    n.speed += clamp(target - n.speed, -BRAKE * dt, ACCEL * dt * 0.92);
    n.z += n.speed * dt;

    n.steerT -= dt;
    if (n.steerT <= 0) { n.steerT = rnd(1.2, 2.8); n.targX = rnd(-0.75, 0.75); }
    let tx = n.targX;
    const car = nearestCar(n.z, n.x, 16 * SEG, 0.4);
    if (car) tx = car.x > n.x ? car.x - 0.75 : car.x + 0.75;
    const closeToP = Math.abs(gap) < 4 * SEG && player.state === 'ride' && !player.finished;
    if (closeToP && Math.abs(n.x - player.x) < 0.8) tx = player.x + (n.x > player.x ? 0.3 : -0.3);
    n.x += clamp(tx - n.x, -dt * 1.1, dt * 1.1);
    n.x -= nseg.curve * (n.speed / MAXSPD) ** 2 * CENTRIFUGAL * dt * 1.6;
    n.x = clamp(n.x, -0.92, 0.92);

    if (n.punchT > 0) n.punchT -= dt;
    n.atkT += dt;
    if (closeToP && Math.abs(n.x - player.x) < 0.5 && Math.abs(gap) < 2.6 * SEG && n.atkT > n.atkCd) {
      n.atkT = 0; n.atkCd = rnd(1.2, 2.4); n.punchT = 0.35;
      player.stamina -= n.club ? rnd(13, 19) : rnd(10, 16);
      player.x += (player.x >= n.x ? 0.2 : -0.2);
      sndPunch(); shake = Math.max(shake, 6);
      say(n.name + (n.club ? ' clubbed you!' : ' hit you!'), 0.9);
      if (player.stamina <= 0 && player.state === 'ride') crashPlayer(n.name + ' knocked you off!');
    }
    const hit = nearestCar(n.z, n.x, 1.6 * SEG, 0.3);
    if (hit && n.speed > MAXSPD * 0.4) { crashNpc(n); say(n.name + ' hit a car!', 1.2); }
    if (n.z >= TRACKLEN - 12 * SEG) { n.finished = true; n.finTime = raceT; }
  }

  /* ----- cops ----- */
  for (const c of cops) {
    if (!live) continue;
    if (c.state === 'crash') {
      c.crashT -= dt;
      c.speed = Math.max(0, c.speed - MAXSPD * dt * 1.7);
      c.z += c.speed * dt;
      if (c.crashT <= 0) {
        // respawn well behind the player, back on patrol
        c.state = 'ride'; c.mode = 'patrol'; c.stamina = 160;
        c.z = player.z - 160 * SEG; c.x = 0.4; c.speed = MAXSPD * 0.4;
      }
      continue;
    }
    const gap = c.z - player.z;
    let target;
    if (c.mode === 'patrol') {
      target = MAXSPD * 0.42;
      if (Math.abs(gap) < 22 * SEG && !player.finished && state === 'race') { c.mode = 'chase'; say('COP ON YOUR TAIL!', 1.6); }
    } else if (c.mode === 'chase') {
      if (gap < -2 * SEG) target = Math.min(MAXSPD * 0.99, player.speed * 1.06 + MAXSPD * 0.08);
      else if (gap > 3 * SEG) target = player.speed * 0.9;
      else target = player.speed;
      if (Math.abs(gap) > 90 * SEG || player.finished) c.mode = 'retreat';
    } else { // retreat
      target = MAXSPD * 0.35;
      if (Math.abs(gap) > 150 * SEG) c.mode = 'patrol';
    }
    const cseg = segAt(c.z);
    target *= 1 - Math.min(0.24, Math.abs(cseg.curve) * 0.04);
    c.speed += clamp(target - c.speed, -BRAKE * dt, ACCEL * dt);
    c.z += c.speed * dt;

    // steering
    let tx = c.mode === 'chase' && Math.abs(gap) < 8 * SEG
      ? clamp(player.x + (c.x > player.x ? 0.32 : -0.32), -0.9, 0.9)
      : 0.4;
    const car = nearestCar(c.z, c.x, 14 * SEG, 0.4);
    if (car) tx = car.x > c.x ? car.x - 0.75 : car.x + 0.75;
    c.targX = tx;
    c.x += clamp(tx - c.x, -dt * 1.2, dt * 1.2);
    c.x = clamp(c.x, -0.92, 0.92);

    // baton swings
    if (c.punchT > 0) c.punchT -= dt;
    c.atkT += dt;
    if (c.mode === 'chase' && player.state === 'ride' && !player.finished &&
        Math.abs(c.x - player.x) < 0.5 && Math.abs(gap) < 2.6 * SEG && c.atkT > c.atkCd) {
      c.atkT = 0; c.atkCd = rnd(1.4, 2.4); c.punchT = 0.35;
      player.stamina -= rnd(11, 15);
      player.x += (player.x >= c.x ? 0.2 : -0.2);
      sndPunch(); shake = Math.max(shake, 6);
      say('The cop swung his baton!', 0.9);
      if (player.stamina <= 0 && player.state === 'ride') crashPlayer('The law caught up with you!');
    }
    const chit = nearestCar(c.z, c.x, 1.6 * SEG, 0.3);
    if (chit && c.speed > MAXSPD * 0.4) { crashNpc(c); say('The cop hit a car!', 1.4); }
  }

  /* ----- player vs rivals bump ----- */
  if (player.state === 'ride' && !player.finished) {
    for (const n of npcs.concat(cops)) {
      if (n.state !== 'ride') continue;
      const dz = n.z - player.z;
      if (dz > 0 && dz < 1.4 * SEG && Math.abs(n.x - player.x) < 0.24 && player.speed > n.speed) {
        player.speed = n.speed * 0.92;
        player.x += player.x >= n.x ? 0.12 : -0.12;
        n.x += n.x >= player.x ? 0.1 : -0.1;
        player.stamina -= 2; shake = Math.max(shake, 3);
      }
    }
    const car = nearestCar(player.z, player.x, 1.5 * SEG, 0.3);
    if (car) {
      const rel = player.speed - car.speed;
      if (rel > MAXSPD * 0.25) crashPlayer('You slammed into traffic!');
      else if (rel > 0) { player.speed = Math.max(0, car.speed * 0.9); shake = Math.max(shake, 4); }
    }
  }

  /* ----- traffic ----- */
  for (const c of cars) c.z = mod(c.z + c.speed * dt, TRACKLEN);

  /* ----- standings ----- */
  let ahead = 0;
  for (const n of npcs) if ((n.finished ? TRACKLEN : n.z) > (player.finished ? TRACKLEN - 1 : player.z)) ahead++;
  if (player.finished) {
    let beat2 = 0; for (const n of npcs) if (n.finished && n.finTime < player.finTime) beat2++;
    player.place = beat2 + 1;
  } else player.place = ahead + 1;

  player.stamina = clamp(player.stamina, 0, 100);
  if (shake > 0) shake = Math.max(0, shake - dt * 18);
  for (let i = msgQ.length - 1; i >= 0; i--) { msgQ[i].life -= dt; if (msgQ[i].life <= 0) msgQ.splice(i, 1); }
}

function onFinish() {
  const pay = PAYOUT[player.place - 1] || 40;
  cash += pay;
  payoutMsg = 'PURSE  $' + pay;
  if (player.place <= 3 && curTrack === unlocked && unlocked < TRACKS.length - 1) {
    unlocked++;
    lsSet('roadbash_unlock', String(unlocked));
    payoutMsg += '   ·   ' + TRACKS[unlocked].name + ' UNLOCKED!';
  }
  saveCash();
}

function crashPlayer(reason) {
  if (player.state === 'crash') return;
  player.state = 'crash'; player.crashT = 2.3; player.busted = false;
  // busted if a cop is on the scene
  for (const c of cops) {
    if (c.state === 'ride' && c.mode === 'chase' && Math.abs(c.z - player.z) < 6 * SEG) {
      player.busted = true; player.crashT = 4.6;
      cash = Math.max(0, cash - FINE); saveCash();
      say('BUSTED!  Fine $' + FINE, 3);
      break;
    }
  }
  sndCrash(); shake = 14;
  if (!player.busted) say(reason, 2);
}
function crashNpc(n) {
  if (n.state === 'crash') return;
  n.state = 'crash'; n.crashT = n.cop ? 8 : rnd(3, 4.5); sndCrash();
}
function nearestFighter(z, x, zr, xr) {
  let best = null, bd = 1e9;
  for (const n of npcs.concat(cops)) {
    if (n.state !== 'ride' || n.finished) continue;
    const dz = Math.abs(n.z - z), dx = Math.abs(n.x - x);
    if (dz < zr && dx < xr && dz + dx * SEG < bd) { bd = dz + dx * SEG; best = n; }
  }
  return best;
}
function nearestCar(z, x, zr, xr) {
  for (const c of cars) {
    const dz = mod(c.z - z, TRACKLEN);
    const d = dz < TRACKLEN / 2 ? dz : dz - TRACKLEN;
    if (d > -SEG && d < zr && Math.abs(c.x - x) < xr) return c;
  }
  return null;
}

/* ============================================================
   RENDER
   ============================================================ */
let skyOff = 0;

function project(p, camX, camY, camZ) {
  p.camera.x = -camX;
  p.camera.y = p.world.y - camY;
  p.camera.z = p.world.z - camZ;
  p.screen.scale = CAMD / Math.max(1, p.camera.z);
  p.screen.x = Math.round(W / 2 + p.screen.scale * p.camera.x * W / 2);
  p.screen.y = Math.round(H / 2 - p.screen.scale * p.camera.y * H / 2);
  p.screen.w = p.screen.scale * ROADW * W / 2;
}

function render() {
  const def = TRACKS[curTrack];
  const baseIdx = Math.floor(mod(player.z, TRACKLEN) / SEG);
  const baseSeg = segments[baseIdx];
  const basePct = (mod(player.z, TRACKLEN) % SEG) / SEG;
  const camY = CAMH + lerp(baseSeg.p1.world.y, baseSeg.p2.world.y, basePct);
  skyOff += baseSeg.curve * player.speed / MAXSPD * 0.35;

  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.save();
  ctx.translate(sx, sy);

  drawSky(def);

  /* --- road pass (front to back) --- */
  let x = 0, dx = -(baseSeg.curve * basePct);
  let maxy = H;
  const camPos = mod(player.z, TRACKLEN);
  const pxWorld = player.x * ROADW;

  for (let n = 0; n < DRAW; n++) {
    const seg = segments[(baseIdx + n) % N];
    const loopAdj = (baseIdx + n) >= N ? TRACKLEN : 0;
    const cz1 = camPos - loopAdj;
    project(seg.p1, pxWorld - x,      camY, cz1);
    project(seg.p2, pxWorld - x - dx, camY, cz1);
    x += dx; dx += seg.curve;
    seg.clip = maxy;
    if (seg.p1.camera.z <= CAMD * 100 || seg.p2.screen.y >= maxy) continue;
    drawSegment(seg, n, def);
    maxy = seg.p2.screen.y;
  }

  /* --- sprite pass (back to front) --- */
  for (let n = DRAW - 1; n > 0; n--) {
    const idx = (baseIdx + n) % N;
    const seg = segments[idx];
    if (seg.p1.camera.z <= CAMD * 100) continue;
    const fog = Math.max(0, 1 - Math.pow(n / DRAW, 1.6) * 1.1);

    for (const s of seg.sprites) drawScenery(seg, s, fog);

    for (const p of pickups) {
      if (p.taken) continue;
      if (Math.floor(mod(p.z, TRACKLEN) / SEG) !== idx) continue;
      const pct = (mod(p.z, TRACKLEN) % SEG) / SEG;
      drawAtRoad(seg, pct, p.x, fog, (X, Y, S) => drawPickup(X, Y, S, p.kind));
    }
    for (const c of cars) {
      if (Math.floor(mod(c.z, TRACKLEN) / SEG) !== idx) continue;
      const pct = (mod(c.z, TRACKLEN) % SEG) / SEG;
      drawAtRoad(seg, pct, c.x, fog, (X, Y, S) => drawCar(X, Y, S, c));
    }
    for (const nn of npcs.concat(cops)) {
      if (Math.floor(mod(nn.z, TRACKLEN) / SEG) !== idx) continue;
      const pct = (mod(nn.z, TRACKLEN) % SEG) / SEG;
      drawAtRoad(seg, pct, nn.x, fog, (X, Y, S) => drawBike(X, Y, S, nn, false));
    }
  }

  drawPlayer();
  ctx.restore();

  drawHUD();
}

function drawSky(def) {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.62);
  g.addColorStop(0, def.sky[0]); g.addColorStop(0.45, def.sky[1]);
  g.addColorStop(0.8, def.sky[2]); g.addColorStop(1, def.sky[3]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.62);
  ctx.fillStyle = def.sky[3]; ctx.fillRect(0, H * 0.6, W, H * 0.4);

  const sunX = mod(W * 0.72 - skyOff * 0.25, W * 1.4) - W * 0.2;
  const sg = ctx.createRadialGradient(sunX, H * 0.44, 8, sunX, H * 0.44, 70);
  sg.addColorStop(0, '#fff3c0'); sg.addColorStop(0.5, '#ffd23c'); sg.addColorStop(1, 'rgba(255,180,60,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sunX, H * 0.44, 70, 0, 7); ctx.fill();

  mountainLayer(H * 0.585, 90, 0.5, def.mountains[0]);
  mountainLayer(H * 0.60, 55, 1.0, def.mountains[1]);
}
function mountainLayer(baseY, amp, para, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, baseY);
  for (let px = 0; px <= W; px += 12) {
    const t = (px + skyOff * para + 4000) * 0.008;
    const h = (Math.sin(t) + Math.sin(t * 2.7) * 0.4 + Math.sin(t * 0.43) * 0.8) * amp * 0.4;
    ctx.lineTo(px, baseY - Math.max(0, h));
  }
  ctx.lineTo(W, baseY); ctx.closePath(); ctx.fill();
}

function drawSegment(seg, n, def) {
  const p1 = seg.p1.screen, p2 = seg.p2.screen;
  const zone = def.zones[zoneOf(seg.index)];
  const alt = Math.floor(seg.index / 4) % 2;
  const fog = Math.max(0, 1 - Math.pow(n / DRAW, 1.6) * 1.1);

  ctx.fillStyle = shade(zone.grass[alt], fog);
  ctx.fillRect(0, p2.y, W, p1.y - p2.y);
  poly(p1.x - p1.w * 1.12, p1.y, p1.x + p1.w * 1.12, p1.y, p2.x + p2.w * 1.12, p2.y, p2.x - p2.w * 1.12, p2.y,
       shade(alt ? '#c8c8c8' : '#b03030', fog));
  poly(p1.x - p1.w, p1.y, p1.x + p1.w, p1.y, p2.x + p2.w, p2.y, p2.x - p2.w, p2.y,
       shade(alt ? '#606068' : '#5a5a62', fog));
  if (alt) {
    const lw1 = p1.w * 0.02, lw2 = p2.w * 0.02;
    poly(p1.x - lw1, p1.y, p1.x + lw1, p1.y, p2.x + lw2, p2.y, p2.x - lw2, p2.y, shade('#e8d44c', fog));
  }
}
function poly(x1, y1, x2, y2, x3, y3, x4, y4, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}
function shade(hex, f) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const fogC = TRACKS[curTrack].fog;
  const m = 0.25 + 0.75 * f;
  return `rgb(${Math.round(lerp(fogC[0], r, m))},${Math.round(lerp(fogC[1], g, m))},${Math.round(lerp(fogC[2], b, m))})`;
}

function drawAtRoad(seg, pct, xOff, fog, fn) {
  const p1 = seg.p1.screen, p2 = seg.p2.screen;
  const scale = lerp(p1.scale, p2.scale, pct);
  const X = lerp(p1.x, p2.x, pct) + scale * xOff * ROADW * W / 2;
  const Y = lerp(p1.y, p2.y, pct);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip();
  ctx.globalAlpha = 0.35 + 0.65 * fog;
  fn(X, Y, scale * W * 0.42);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawScenery(seg, s, fog) {
  drawAtRoad(seg, 0.5, s.x, fog, (X, Y, S) => {
    const u = S * 1000;
    ctx.lineWidth = Math.max(1, u * 0.02);
    switch (s.kind) {
      case 'palm': {
        ctx.strokeStyle = '#6b4a2c'; ctx.lineWidth = u * 0.05;
        ctx.beginPath(); ctx.moveTo(X, Y);
        ctx.quadraticCurveTo(X + u * 0.12, Y - u * 0.28, X + u * 0.2, Y - u * 0.52); ctx.stroke();
        ctx.strokeStyle = '#2f8f3f'; ctx.lineWidth = u * 0.035;
        for (let a = 0; a < 6; a++) {
          const ang = -Math.PI / 2 + (a - 2.5) * 0.5 + s.seed;
          ctx.beginPath(); ctx.moveTo(X + u * 0.2, Y - u * 0.52);
          ctx.quadraticCurveTo(X + u * 0.2 + Math.cos(ang) * u * 0.22, Y - u * 0.52 + Math.sin(ang) * u * 0.22 - u * 0.06,
                               X + u * 0.2 + Math.cos(ang) * u * 0.34, Y - u * 0.52 + Math.sin(ang) * u * 0.3);
          ctx.stroke();
        }
        break;
      }
      case 'pine': {
        ctx.fillStyle = '#5b3a20'; ctx.fillRect(X - u * 0.025, Y - u * 0.14, u * 0.05, u * 0.14);
        ctx.fillStyle = '#1e6b34';
        for (let t = 0; t < 3; t++) {
          const w = u * (0.22 - t * 0.05), yy = Y - u * (0.12 + t * 0.14);
          ctx.beginPath(); ctx.moveTo(X - w, yy); ctx.lineTo(X + w, yy); ctx.lineTo(X, yy - u * 0.2); ctx.closePath(); ctx.fill();
        }
        break;
      }
      case 'cactus': {
        ctx.strokeStyle = '#3e8e41'; ctx.lineCap = 'round'; ctx.lineWidth = u * 0.06;
        ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X, Y - u * 0.4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(X - u * 0.12, Y - u * 0.32); ctx.lineTo(X - u * 0.12, Y - u * 0.2); ctx.lineTo(X, Y - u * 0.22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(X + u * 0.12, Y - u * 0.38); ctx.lineTo(X + u * 0.12, Y - u * 0.26); ctx.lineTo(X, Y - u * 0.28); ctx.stroke();
        ctx.lineCap = 'butt';
        break;
      }
      case 'bush': {
        ctx.fillStyle = '#2e7d32';
        ctx.beginPath(); ctx.arc(X - u * 0.06, Y - u * 0.05, u * 0.08, 0, 7);
        ctx.arc(X + u * 0.05, Y - u * 0.06, u * 0.09, 0, 7);
        ctx.arc(X, Y - u * 0.11, u * 0.08, 0, 7); ctx.fill();
        break;
      }
      case 'billboard': {
        ctx.fillStyle = '#7a5a38';
        ctx.fillRect(X - u * 0.16, Y - u * 0.3, u * 0.04, u * 0.3);
        ctx.fillRect(X + u * 0.12, Y - u * 0.3, u * 0.04, u * 0.3);
        ctx.fillStyle = '#f5e9d0'; ctx.fillRect(X - u * 0.25, Y - u * 0.55, u * 0.5, u * 0.28);
        ctx.strokeStyle = '#333'; ctx.strokeRect(X - u * 0.25, Y - u * 0.55, u * 0.5, u * 0.28);
        ctx.fillStyle = '#c0392b';
        ctx.font = 'bold ' + Math.max(4, u * 0.09) + 'px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(s.seed < 0.5 ? 'RASH COLA' : 'BIKE SHOP', X, Y - u * 0.38);
        break;
      }
      case 'barn': {
        ctx.fillStyle = '#8e3b2f'; ctx.fillRect(X - u * 0.3, Y - u * 0.3, u * 0.6, u * 0.3);
        ctx.fillStyle = '#6e2a20';
        ctx.beginPath(); ctx.moveTo(X - u * 0.34, Y - u * 0.3); ctx.lineTo(X + u * 0.34, Y - u * 0.3); ctx.lineTo(X, Y - u * 0.5); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#4a2018'; ctx.fillRect(X - u * 0.07, Y - u * 0.18, u * 0.14, u * 0.18);
        break;
      }
      case 'banner': {
        ctx.fillStyle = '#888';
        const p1 = seg.p1.screen;
        const legL = p1.x - p1.w * 1.15, legR = p1.x + p1.w * 1.15;
        ctx.fillRect(legL - u * 0.02, Y - u * 0.42, u * 0.04, u * 0.42);
        ctx.fillRect(legR - u * 0.02, Y - u * 0.42, u * 0.04, u * 0.42);
        ctx.fillStyle = '#111';
        ctx.fillRect(legL, Y - u * 0.52, legR - legL, u * 0.13);
        ctx.fillStyle = '#fff';
        const cw = u * 0.032;
        for (let cx = legL; cx < legR - cw; cx += cw * 2)
          for (let cy2 = 0; cy2 < 4; cy2++)
            ctx.fillRect(cx + (cy2 % 2) * cw, Y - u * 0.52 + cy2 * cw, cw, cw);
        ctx.fillStyle = '#ffd23c';
        ctx.font = 'bold ' + Math.max(5, u * 0.07) + 'px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(s.text, (legL + legR) / 2, Y - u * 0.55);
        break;
      }
    }
  });
}

function drawPickup(X, Y, S, kind) {
  const u = S * 1000;
  const bob = Math.sin(performance.now() / 250) * u * 0.02;
  const y = Y - u * 0.06 + bob;
  ctx.save();
  ctx.translate(X, y);
  // glow disc on the tarmac
  ctx.fillStyle = 'rgba(255,255,160,0.25)';
  ctx.beginPath(); ctx.ellipse(0, u * 0.05, u * 0.11, u * 0.035, 0, 0, 7); ctx.fill();
  switch (kind) {
    case 'nitro':
      ctx.fillStyle = '#d43a3a';
      ctx.fillRect(-u * 0.045, -u * 0.16, u * 0.09, u * 0.16);
      ctx.fillStyle = '#e8e8f2'; ctx.fillRect(-u * 0.045, -u * 0.125, u * 0.09, u * 0.045);
      ctx.fillStyle = '#333'; ctx.fillRect(-u * 0.02, -u * 0.19, u * 0.04, u * 0.035);
      ctx.fillStyle = '#111';
      ctx.font = 'bold ' + Math.max(4, u * 0.05) + 'px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('N', 0, -u * 0.028);
      break;
    case 'club':
      ctx.strokeStyle = '#8a5a2c'; ctx.lineWidth = u * 0.035; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-u * 0.06, u * 0.02); ctx.lineTo(u * 0.06, -u * 0.14); ctx.stroke();
      ctx.strokeStyle = '#6e4520'; ctx.lineWidth = u * 0.055;
      ctx.beginPath(); ctx.moveTo(u * 0.025, -u * 0.095); ctx.lineTo(u * 0.06, -u * 0.14); ctx.stroke();
      ctx.lineCap = 'butt';
      break;
    case 'chain':
      ctx.strokeStyle = '#b8b8c8'; ctx.lineWidth = u * 0.018;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.ellipse(-u * 0.06 + i * u * 0.03, -u * 0.04 - Math.sin(i * 1.2) * u * 0.05, u * 0.022, u * 0.014, i * 0.6, 0, 7);
        ctx.stroke();
      }
      break;
    case 'wrench':
      ctx.strokeStyle = '#c9c9d4'; ctx.lineWidth = u * 0.03; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-u * 0.05, u * 0.0); ctx.lineTo(u * 0.04, -u * 0.11); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.arc(u * 0.05, -u * 0.125, u * 0.035, 0.6, 4.3); ctx.stroke();
      break;
  }
  ctx.restore();
}

function drawCar(X, Y, S, c) {
  const u = S * 1000;
  const w = u * (c.kind === 'truck' ? 0.34 : 0.3), h = u * (c.kind === 'truck' ? 0.3 : 0.19);
  ctx.fillStyle = `hsl(${c.hue},45%,45%)`;
  rrect(X - w / 2, Y - h, w, h * 0.92, u * 0.02);
  ctx.fillStyle = '#1a1a22';
  ctx.fillRect(X - w / 2 - u * 0.015, Y - h * 0.3, u * 0.03, h * 0.3);
  ctx.fillRect(X + w / 2 - u * 0.015, Y - h * 0.3, u * 0.03, h * 0.3);
  if (c.oncoming) {
    ctx.fillStyle = '#2a2a33'; rrect(X - w * 0.4, Y - h * 0.95, w * 0.8, h * 0.4, u * 0.015);
    ctx.fillStyle = '#ffe9a0';
    ctx.fillRect(X - w * 0.42, Y - h * 0.42, w * 0.18, h * 0.16);
    ctx.fillRect(X + w * 0.24, Y - h * 0.42, w * 0.18, h * 0.16);
  } else {
    ctx.fillStyle = '#2a2a33'; rrect(X - w * 0.4, Y - h * 0.95, w * 0.8, h * 0.4, u * 0.015);
    ctx.fillStyle = '#d23a2a';
    ctx.fillRect(X - w * 0.44, Y - h * 0.4, w * 0.16, h * 0.14);
    ctx.fillRect(X + w * 0.28, Y - h * 0.4, w * 0.16, h * 0.14);
  }
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}

/* rear-view motorcycle + rider; used for player, rivals and cops */
function drawBike(X, Y, S, who, isPlayer) {
  const s = S;
  const crash = who.state === 'crash';
  ctx.save();
  ctx.translate(X, Y);
  if (crash) {
    ctx.rotate(Math.sin((who.crashT || 0) * 9) * 0.5);
    ctx.translate(0, -Math.abs(Math.sin((who.crashT || 0) * 5)) * 14 * s);
  }
  const lean = who === player
    ? ((input.left || keys.ArrowLeft ? -1 : 0) + (input.right || keys.ArrowRight ? 1 : 0)) * 0.22
    : clamp((who.targX - who.x) * 0.6, -0.25, 0.25);
  ctx.rotate(crash ? 0 : lean);

  // nitro flames
  if (isPlayer && player.nitroT > 0 && !crash) {
    const fl = Math.random();
    ctx.fillStyle = fl < 0.5 ? '#4fa8ff' : '#ffd23c';
    ctx.beginPath();
    ctx.moveTo(-14 * s, -6 * s);
    ctx.lineTo(0, (16 + fl * 22) * s);
    ctx.lineTo(14 * s, -6 * s);
    ctx.closePath(); ctx.fill();
  }

  // rear tyre
  ctx.fillStyle = '#15151c';
  ctx.beginPath(); ctx.ellipse(0, -14 * s, 15 * s, 24 * s, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a3a44';
  ctx.beginPath(); ctx.ellipse(0, -14 * s, 7 * s, 13 * s, 0, 0, 7); ctx.fill();
  // fender + body
  ctx.fillStyle = who.bike;
  ctx.beginPath();
  ctx.moveTo(-20 * s, -34 * s); ctx.quadraticCurveTo(0, -48 * s, 20 * s, -34 * s);
  ctx.lineTo(14 * s, -22 * s); ctx.quadraticCurveTo(0, -30 * s, -14 * s, -22 * s);
  ctx.closePath(); ctx.fill();
  // cop: white fender flash + POLICE text
  if (who.cop) {
    ctx.fillStyle = '#e8e8f2';
    ctx.fillRect(-16 * s, -33 * s, 32 * s, 6 * s);
    ctx.fillStyle = '#111';
    ctx.font = 'bold ' + Math.max(3, 5 * s) + 'px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('POLICE', 0, -28 * s);
  }
  // exhausts
  ctx.fillStyle = '#c9c9d4';
  ctx.fillRect(-26 * s, -26 * s, 8 * s, 14 * s);
  ctx.fillRect(18 * s, -26 * s, 8 * s, 14 * s);
  // rider torso
  const punchingL = who.punchT > 0.1 && (who === player ? punchSide() < 0 : who.x > player.x);
  const punchingR = who.punchT > 0.1 && !punchingL;
  const kicking = who === player && who.kickT > 0.12 && who.kickT < 0.42;
  ctx.fillStyle = who.suit;
  ctx.beginPath();
  ctx.moveTo(-16 * s, -34 * s);
  ctx.quadraticCurveTo(-19 * s, -66 * s, 0, -70 * s);
  ctx.quadraticCurveTo(19 * s, -66 * s, 16 * s, -34 * s);
  ctx.closePath(); ctx.fill();
  // arms (with weapon when swinging)
  ctx.strokeStyle = who.suit; ctx.lineWidth = 8 * s; ctx.lineCap = 'round';
  const weap = who === player ? (player.weapon && player.weapon.kind) : (who.club ? 'club' : (who.cop ? 'baton' : null));
  if (punchingL) { ctx.beginPath(); ctx.moveTo(-10 * s, -58 * s); ctx.lineTo(-44 * s, -56 * s); ctx.stroke(); armEnd(-46 * s, -56 * s, s, weap, -1); }
  else { ctx.beginPath(); ctx.moveTo(-12 * s, -58 * s); ctx.lineTo(-24 * s, -40 * s); ctx.stroke(); }
  if (punchingR) { ctx.beginPath(); ctx.moveTo(10 * s, -58 * s); ctx.lineTo(44 * s, -56 * s); ctx.stroke(); armEnd(46 * s, -56 * s, s, weap, 1); }
  else { ctx.beginPath(); ctx.moveTo(12 * s, -58 * s); ctx.lineTo(24 * s, -40 * s); ctx.stroke(); }
  // kick leg
  if (kicking) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 9 * s;
    const side = punchSide() < 0 ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(side * 10 * s, -26 * s); ctx.lineTo(side * 46 * s, -30 * s); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.fillRect(side * 44 * s - 6 * s, -36 * s, 14 * s, 10 * s);
  }
  // helmet
  ctx.fillStyle = who.cop ? '#f5f5fa' : (who === player ? '#e8e8f2' : '#d8d8e0');
  ctx.beginPath(); ctx.arc(0, -76 * s, 11 * s, 0, 7); ctx.fill();
  if (!who.cop) {
    ctx.fillStyle = who.bike;
    ctx.beginPath(); ctx.arc(0, -76 * s, 11 * s, Math.PI * 1.15, Math.PI * 1.85); ctx.fill();
  } else {
    // flashing light bar
    const flash = Math.floor(performance.now() / 180) % 2;
    ctx.fillStyle = flash ? '#ff3b30' : '#2f6fff';
    ctx.fillRect(-12 * s, -94 * s, 11 * s, 6 * s);
    ctx.fillStyle = flash ? '#2f6fff' : '#ff3b30';
    ctx.fillRect(1 * s, -94 * s, 11 * s, 6 * s);
    ctx.fillStyle = '#c9c9d4'; ctx.fillRect(-3 * s, -88 * s, 6 * s, 6 * s);
  }
  ctx.restore();

  function armEnd(fx, fy, s2, weapKind, dir) {
    ctx.fillStyle = '#d8a06a';
    ctx.beginPath(); ctx.arc(fx, fy, 6.5 * s2, 0, 7); ctx.fill();
    if (weapKind === 'club' || weapKind === 'baton') {
      ctx.strokeStyle = weapKind === 'baton' ? '#222' : '#8a5a2c';
      ctx.lineWidth = 5 * s2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + dir * 20 * s2, fy - 6 * s2); ctx.stroke();
      ctx.lineCap = 'butt';
    } else if (weapKind === 'chain') {
      ctx.strokeStyle = '#b8b8c8'; ctx.lineWidth = 2.5 * s2;
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.quadraticCurveTo(fx + dir * 14 * s2, fy + 6 * s2, fx + dir * 26 * s2, fy - 4 * s2);
      ctx.stroke();
    }
  }
}
function punchSide() {
  const n = nearestFighter(player.z, player.x, 3 * SEG, 0.7);
  return n ? (n.x < player.x ? -1 : 1) : 1;
}

function drawPlayer() {
  const bounce = Math.sin(performance.now() / 60) * clamp(player.speed / MAXSPD, 0, 1) * 2
               + (Math.abs(player.x) > 1.02 ? Math.sin(performance.now() / 28) * 3 : 0);
  drawBike(W / 2, H - 42 + bounce, 1.05, player, true);
  // nitro speed lines
  if (player.nitroT > 0 && player.state === 'ride') {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const ly = rnd(0, H), lx = rnd(0, 1) < 0.5 ? rnd(0, W * 0.22) : rnd(W * 0.78, W);
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + rnd(-40, -14) * (lx < W / 2 ? -1 : 1), ly); ctx.stroke();
    }
  }
}

/* ============================================================
   HUD & SCREENS
   ============================================================ */
const ORD = ['1st', '2nd', '3rd', '4th', '5th', '6th'];
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t % 1) * 10);
  return m + ':' + String(s).padStart(2, '0') + '.' + d;
}

function drawHUD() {
  if (state === 'title') { drawTitle(); return; }
  if (state === 'select') { drawSelect(); return; }

  ctx.textAlign = 'left';
  ctx.font = 'bold 34px Courier New';
  ctx.fillStyle = '#000a'; ctx.fillText(ORD[player.place - 1], 18, 42);
  ctx.fillStyle = player.place === 1 ? '#ffd23c' : '#fff';
  ctx.fillText(ORD[player.place - 1], 16, 40);
  // stamina bar
  ctx.fillStyle = '#000a'; ctx.fillRect(16, 50, 150, 14);
  ctx.fillStyle = player.stamina > 35 ? '#3ecf5a' : '#e0432d';
  ctx.fillRect(18, 52, 146 * player.stamina / 100, 10);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(16, 50, 150, 14);
  // nitro charges
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < player.nitro ? '#4fa8ff' : 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.moveTo(22 + i * 22, 88); ctx.lineTo(28 + i * 22, 72); ctx.lineTo(34 + i * 22, 88);
    ctx.quadraticCurveTo(28 + i * 22, 82, 22 + i * 22, 88);
    ctx.fill();
  }
  // weapon
  if (player.weapon) {
    ctx.font = 'bold 16px Courier New'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd23c';
    ctx.fillText(player.weapon.kind.toUpperCase() + ' x' + player.weapon.uses, 90, 86);
  }

  // timer
  ctx.textAlign = 'center'; ctx.font = 'bold 24px Courier New';
  ctx.fillStyle = '#000a'; ctx.fillText(fmtTime(raceT), W / 2 + 2, 34);
  ctx.fillStyle = '#fff'; ctx.fillText(fmtTime(raceT), W / 2, 32);

  // speed
  ctx.textAlign = 'right'; ctx.font = 'bold 34px Courier New';
  const mph = Math.round(player.speed * MPH);
  ctx.fillStyle = '#000a'; ctx.fillText(mph + ' mph', W - 14, 42);
  ctx.fillStyle = player.nitroT > 0 ? '#4fa8ff' : '#fff'; ctx.fillText(mph + ' mph', W - 16, 40);

  // progress bar
  ctx.fillStyle = '#0008'; ctx.fillRect(W / 2 - 120, 44, 240, 8);
  ctx.fillStyle = '#ffd23c'; ctx.fillRect(W / 2 - 120, 44, 240 * clamp(player.z / (TRACKLEN - 12 * SEG), 0, 1), 8);

  // foe health bar
  const foe = nearestFighter(player.z, player.x, 4 * SEG, 0.9);
  if (foe && state === 'race') {
    ctx.textAlign = 'right'; ctx.font = 'bold 16px Courier New';
    ctx.fillStyle = foe.cop ? '#7fb2ff' : '#fff'; ctx.fillText(foe.name, W - 16, 66);
    ctx.fillStyle = '#000a'; ctx.fillRect(W - 166, 72, 150, 10);
    ctx.fillStyle = '#e0432d';
    ctx.fillRect(W - 164, 74, 146 * clamp(foe.stamina, 0, foe.cop ? 160 : 100) / (foe.cop ? 160 : 100), 6);
  }

  // messages
  ctx.textAlign = 'center'; ctx.font = 'bold 22px Courier New';
  msgQ.forEach((m, i) => {
    const a = clamp(m.life / 0.4, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.6 * a})`; ctx.fillText(m.t, W / 2 + 1, 92 + i * 26 + 1);
    ctx.fillStyle = `rgba(255,220,80,${a})`; ctx.fillText(m.t, W / 2, 92 + i * 26);
  });

  // busted overlay
  if (player.busted && player.state === 'crash') {
    ctx.font = 'bold 84px Courier New'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000a'; ctx.fillText('BUSTED!', W / 2 + 4, H / 2 + 4);
    ctx.fillStyle = Math.floor(performance.now() / 200) % 2 ? '#ff3b30' : '#2f6fff';
    ctx.fillText('BUSTED!', W / 2, H / 2);
  }

  if (state === 'count') {
    const n = Math.ceil(countT - 0.6);
    ctx.font = 'bold 110px Courier New'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000a'; ctx.fillText(n > 0 ? n : 'GO!', W / 2 + 4, H / 2 + 4);
    ctx.fillStyle = n > 0 ? '#ffd23c' : '#3ecf5a'; ctx.fillText(n > 0 ? n : 'GO!', W / 2, H / 2);
    ctx.font = 'bold 22px Courier New'; ctx.fillStyle = '#fff';
    ctx.fillText(TRACKS[curTrack].name, W / 2, H / 2 + 50);
  }

  if (state === 'finish') drawFinish();

  if (!touchMode && state === 'race') {
    ctx.font = '13px Courier New'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff88';
    ctx.fillText('ARROWS steer/brake · A punch · S kick · N nitro', W / 2, H - 8);
  }
}

function drawTitle() {
  ctx.fillStyle = '#0009'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 92px Courier New';
  ctx.fillStyle = '#000'; ctx.fillText('ROAD BASH', W / 2 + 5, H * 0.36 + 5);
  const g = ctx.createLinearGradient(0, H * 0.2, 0, H * 0.4);
  g.addColorStop(0, '#ffd23c'); g.addColorStop(1, '#e0432d');
  ctx.fillStyle = g; ctx.fillText('ROAD BASH', W / 2, H * 0.36);
  ctx.font = 'bold 20px Courier New'; ctx.fillStyle = '#fff';
  ctx.fillText('a  R O A D   R A S H  tribute', W / 2, H * 0.44);

  ctx.font = 'bold 26px Courier New';
  ctx.fillStyle = Math.floor(performance.now() / 500) % 2 ? '#ffd23c' : '#fff';
  ctx.fillText(touchMode ? 'TAP TO RIDE' : 'PRESS ENTER TO RIDE', W / 2, H * 0.62);

  ctx.font = '16px Courier New'; ctx.fillStyle = '#ccc';
  ctx.fillText('Punch, kick, club and chain your rivals off their bikes.', W / 2, H * 0.72);
  ctx.fillText('Grab nitro cans. Dodge traffic. Outrun the law.', W / 2, H * 0.755);
}

function drawSelect() {
  ctx.fillStyle = '#0009'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Courier New';
  ctx.fillStyle = '#ffd23c'; ctx.fillText('CHOOSE YOUR ROAD', W / 2, 80);

  ctx.font = 'bold 22px Courier New'; ctx.textAlign = 'right';
  ctx.fillStyle = '#3ecf5a'; ctx.fillText('$' + cash, W - 24, 40);

  for (let i = 0; i < TRACKS.length; i++) {
    const r = cardRect(i), t = TRACKS[i];
    const locked = i > unlocked, sel = i === selIdx;
    ctx.fillStyle = locked ? 'rgba(30,30,40,0.85)' : (sel ? 'rgba(70,45,20,0.9)' : 'rgba(25,25,45,0.85)');
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = sel ? '#ffd23c' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.textAlign = 'center';
    ctx.font = 'bold 20px Courier New';
    ctx.fillStyle = locked ? '#777' : '#fff';
    ctx.fillText(t.name, r.x + r.w / 2, r.y + 38);
    // difficulty stars
    ctx.font = '18px Courier New';
    ctx.fillStyle = locked ? '#666' : '#ffd23c';
    ctx.fillText('★'.repeat(t.stars) + '☆'.repeat(3 - t.stars), r.x + r.w / 2, r.y + 66);
    // mini sky preview stripe
    const grd = ctx.createLinearGradient(0, r.y + 84, 0, r.y + 128);
    grd.addColorStop(0, t.sky[0]); grd.addColorStop(0.6, t.sky[1]); grd.addColorStop(1, t.sky[2]);
    ctx.fillStyle = grd; ctx.fillRect(r.x + 20, r.y + 84, r.w - 40, 44);
    ctx.fillStyle = t.zones[0].grass[0]; ctx.fillRect(r.x + 20, r.y + 122, r.w - 40, 8);

    ctx.font = '15px Courier New';
    if (locked) {
      ctx.fillStyle = '#aaa';
      ctx.fillText('🔒 LOCKED', r.x + r.w / 2, r.y + 156);
      ctx.font = '12px Courier New';
      ctx.fillText('top 3 on ' + TRACKS[i - 1].name.split(' ')[0], r.x + r.w / 2, r.y + 176);
    } else {
      const best = lsGet('roadbash_best_' + i);
      ctx.fillStyle = '#ccc';
      ctx.fillText(best ? 'BEST ' + fmtTime(parseFloat(best)) : 'no record yet', r.x + r.w / 2, r.y + 156);
      ctx.fillStyle = '#9fd4ff';
      ctx.fillText(t.cops + (t.cops > 1 ? ' cops' : ' cop') + ' · heavy fists', r.x + r.w / 2, r.y + 178);
    }
  }

  ctx.font = 'bold 20px Courier New'; ctx.textAlign = 'center';
  ctx.fillStyle = Math.floor(performance.now() / 500) % 2 ? '#ffd23c' : '#fff';
  ctx.fillText(touchMode ? 'TAP A TRACK TO RACE' : '◀ ▶ CHOOSE · ENTER TO RACE', W / 2, H - 60);
}

function drawFinish() {
  const a = clamp(finishT, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${a * 0.55})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 72px Courier New';
  const win = player.place <= 3;
  ctx.fillStyle = '#000'; ctx.fillText(ORD[player.place - 1] + ' PLACE', W / 2 + 4, H * 0.36 + 4);
  ctx.fillStyle = win ? '#ffd23c' : '#e0432d'; ctx.fillText(ORD[player.place - 1] + ' PLACE', W / 2, H * 0.36);
  ctx.font = 'bold 28px Courier New'; ctx.fillStyle = '#fff';
  ctx.fillText('TIME  ' + fmtTime(player.finTime), W / 2, H * 0.48);
  ctx.font = 'bold 22px Courier New'; ctx.fillStyle = '#3ecf5a';
  ctx.fillText(payoutMsg + '   ·   WALLET $' + cash, W / 2, H * 0.56);
  const bk = 'roadbash_best_' + curTrack;
  const best = lsGet(bk);
  if (!best || player.finTime < parseFloat(best)) {
    lsSet(bk, String(player.finTime));
    ctx.fillStyle = '#4fa8ff'; ctx.fillText('NEW RECORD!', W / 2, H * 0.63);
  }
  if (finishT > 1) {
    ctx.font = 'bold 22px Courier New';
    ctx.fillStyle = Math.floor(performance.now() / 500) % 2 ? '#ffd23c' : '#fff';
    ctx.fillText(touchMode ? 'TAP FOR TRACK SELECT' : 'ENTER FOR TRACK SELECT', W / 2, H * 0.72);
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.1) dt = 0.1;
  update(dt);
  render();
  engineTick();
  requestAnimationFrame(frame);
}
buildTrack(0);
resetRace();
requestAnimationFrame(frame);

document.addEventListener('visibilitychange', () => {
  if (AC) { if (document.hidden) AC.suspend(); else AC.resume(); }
});
</script>
</body>
</html>
